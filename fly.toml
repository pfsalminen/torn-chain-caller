# fly.toml app configuration file generated for chain-claims on 2026-01-17T20:52:13-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chain-claims'
primary_region = 'ord'

[build]

[env]
  DATABASE_URL = 'sqlite+aiosqlite:////data/chain_claims.db'

[[mounts]]
  source = 'chain_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
